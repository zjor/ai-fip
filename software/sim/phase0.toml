# Phase 0 feasibility inputs. Provenance is given per block; anything marked
# PLANNING or UNSURE has not been measured and must be replaced before the gate
# is declared passed. ASSUMPTION marks an input that stays unmeasured by
# decision, with a bound and a documented margin.

[design]
# From hardware/cad (make masses), 2026-09-04. Nominal = CAD + catalogue hardware
# masses; -10 % / +10 % covers print density, screws and cable. Still no
# measured parts.
total_mass_kg = [0.6988, 0.7765, 0.8541]
center_of_mass_m = [0.1313, 0.1459, 0.1605]
# Pendulum body inertia about the pivot, wheel counted as a point mass
# (wheel spin inertia is the separate state below).
pivot_inertia_kg_m2 = [0.02598, 0.02887, 0.03176]
# Wheel from CAD plus the measured rotor + hub inertia 0.000024 kg*m^2
# (PNDLM-11, docs/hardware/measurements/2026-11-01-rotating-losses.json,
# inertia.rotor_and_hub_kg_m2, +/- 0.00001).
flywheel_inertia_kg_m2 = [0.002413, 0.002678, 0.002944]

[battery]
# Placement study only. 4S LiPo, 850–1300 mAh class. Mass is UNSURE (typical
# 100–130 g); the top-end radius is the rod length from the planning range.
mass_kg = 0.12
top_end_radius_m = 0.25

[requirements]
# Decision 2026-09-04: the device must survive a finger poke; anything larger
# is allowed to fall, flip, and swing back up.
target_recovery_angle_deg = 10.0
preferred_recovery_angle_deg = 20.0
minimum_peak_margin = 1.5
preferred_peak_margin = 2.0
minimum_continuous_torque_nm = 0.20
# Preliminary time-scale rules. Phase 2 must verify these with the controller,
# estimator, quantization, noise, and delay in the loop.
maximum_delay_fraction_of_time_constant = 0.10
maximum_sample_period_fraction_of_time_constant = 0.05
# Swing-up gate: wheel speed at the catch must stay below this fraction of the
# no-load speed so that torque is still available for the catch.
maximum_wheel_speed_fraction_at_catch = 0.7

[power]
# 4S LiPo (decision 2026-09-04). Minimum = loaded pack near empty.
minimum_bus_voltage_v = 12.0
nominal_bus_voltage_v = 14.8

[moteus]
# Verified in moteus firmware (fw/bldc_servo.cc, fw/bldc_servo_control.h):
#   Kt = (3/2)(1/sqrt3)(60/2pi) / Kv           -> 8.27 / Kv
#   v_per_hz = 60 / (sqrt3 * Kv)              (phase volts per rotor Hz)
#   V_eff = 0.5 * V_bus * max_voltage_ratio * (1 - modulation_margin)
#   (v_per_hz f + R iq)^2 + (pi poles L iq f)^2 <= V_eff^2   (voltage circle)
modulation_margin = 0.15
# Measured 2026-11-04, PNDLM-12: r_max = 1.00 +/- 0.03 (0.9959, se 0.0294,
# n 48; the K_t uncertainty dominates) from no-load and base speeds at
# 11-15 V with Kv 339 from the measured K_t.
# docs/hardware/measurements/2026-11-04-torque-speed.json (r_max). Replaces the
# UNSURE 0.94. Measured no-load slope: 248.3 +/- 1.0 rpm/V of loaded bus.
max_voltage_ratio = 1.0

[motor]
name = "mjbots mj5208"
# Measured 2026-10-26, PNDLM-9: lever and scale on a held rotor, 7 runs
# 20261026T095749Z..175936Z, 1-8 A per commanded amp, linear region.
# docs/hardware/measurements/2026-10-26-torque-constant.json
# (simulator.kt_linear_region_per_commanded_a_nm_per_a = 0.02444), +/- 3 % (1 sd).
# Not measured above 8 A; the 1.7 Nm peak (about 70 A) is an extrapolation.
torque_constant_nm_per_a = 0.0244
# Kv follows from K_t by the moteus convention: 8.27 / 0.0244 = 339 rpm/V.
# PNDLM-12 confirms it: with Kv 339 the voltage circle fits every measured
# no-load and base speed with r_max 1.00. Product page Kv 330 and firmware
# motor.Kv 296 are not used (296 would need the impossible r_max 1.137).
# Controller calibration dump (PNDLM-12 runs, 2026-11-04), line-to-centre:
# R 0.0467 ohm, L_q 44.8 uH. The mjbots blog values (0.047 ohm, 28.6 uH) are
# replaced; R matches, L is 57 % higher.
phase_resistance_ohm = 0.0467
phase_inductance_h = 44.8e-6
# moteus documentation example configuration for the mj5208 (motor.poles = 14).
poles = 14
# Product page (2026-09-04): peak 1.7 Nm, 600 W, 7500 rpm, 193 g, 63x25 mm.
peak_torque_nm = 1.7
max_rpm = 7500.0
mass_kg = 0.193
# ASSUMPTION, not measured (PNDLM-13 closed by assumption on 2026-11-09, no
# temperature sensor): winding-to-ambient thermal resistance for a 63 mm
# outrunner with no airflow, and the allowed steady-state winding rise (a
# hard limit: magnet grade unknown, N grades lose field for good above ~80 C).
# Copper loss P = 1.5 * I^2 * R(T), R(T) = R * (1 + copper_tempco * dT).
# Hot K_t = K_t * (1 + magnet_tempco * dT), worst case: magnets as hot as the
# winding. Break-even for 0.20 Nm continuous is R_th 8.9 K/W.
# docs/physics/phase-0-feasibility.md#continuous-thermal-gate
thermal_resistance_k_per_w = [3.0, 4.5, 6.0]
allowed_winding_rise_k = 60.0
copper_tempco_per_k = 0.00393
magnet_tempco_per_k = -0.0012

[[drivers]]
# mjbots product page (2026-09-04).
name = "moteus-c1"
peak_phase_current_a = 20.0
continuous_phase_current_a = 5.0
continuous_phase_current_cooled_a = 14.0
max_bus_voltage_v = 51.0
mass_kg = 0.0089
price_usd = 69.0

[[drivers]]
# mjbots product page (2026-09-04).
name = "moteus-r4.11"
peak_phase_current_a = 100.0
continuous_phase_current_a = 12.0
continuous_phase_current_cooled_a = 32.0
max_bus_voltage_v = 44.0
mass_kg = 0.0142
price_usd = 94.0

[losses]
# Rotating losses of the mj5208 rotor, tau = a*tanh(w/w_s) + b*w + c*w*|w|,
# w = wheel speed relative to the body. Measured on the bench test disc,
# 2026-11-01, PNDLM-11: docs/hardware/measurements/2026-11-01-rotating-losses.json
# (a = 4.43 +/- 0.07 mNm, b = 37.8 +/- 1.4 uNm*s, c = 9.7 +/- 5.6 nNm*s^2).
# a range 3-7 mNm is the documented assumption for the final assembly
# (bearing preload, temperature): docs/hardware/specs/coast-down.md section 8.
# b range is +/- 2 SE and the 2.6 % inertia uncertainty. c is disc windage and
# barely resolved; it does not transfer to the final wheel, kept for scale.
# Breakaway below ~1 rev/s was not measured; w_s smooths the Coulomb step.
# The bench rotor + hub inertia is added to [design] flywheel_inertia_kg_m2.
coulomb_nm = [0.003, 0.00443, 0.007]
viscous_nm_s = [3.55e-5, 3.78e-5, 4.0e-5]
windage_nm_s2 = 9.7e-9
coulomb_smoothing_rad_s = 0.5
