[common]
controller_id = 1
watchdog_timeout_s = 0.10
output_root = "logs/bench"

[safety]
min_bus_voltage_v = 10.0
max_bus_voltage_v = 30.0
max_controller_temperature_c = 65.0
max_motor_temperature_c = 70.0
max_phase_current_a = 8.0
max_abs_velocity_rev_s = 1.0
max_torque_nm = 0.15
max_position_excursion_rev = 0.25
max_friction_velocity_rev_s = 0.35
max_friction_excursion_rev = 1.10
# Tier B: retained rotating assembly (test disc) and guard, docs/hardware/specs/coast-down.md.
# Only coast-down may use these; every other experiment keeps the Tier A values above.
max_rotating_velocity_rev_s = 55.0
max_rotating_torque_nm = 0.20

[inspect]
duration_s = 5.0
sample_rate_hz = 20.0

[position_step]
sample_rate_hz = 200.0
step_rev = 0.08333333333333333
hold_s = 1.0
settle_s = 0.5
cycles = 2
max_torque_nm = 0.10
velocity_limit_rev_s = 0.50
accel_limit_rev_s2 = 4.0

[friction]
sample_rate_hz = 200.0
travel_rev = 1.0
sweep_center_rev = 0.0
velocity_limit_rev_s = 0.02
accel_limit_rev_s2 = 0.20
max_torque_nm = 0.05
settle_s = 1.0
turnaround_s = 0.5
move_timeout_s = 65.0
position_bound_margin_rev = 0.02

[response_timing]
sample_rate_hz = 200.0
pulse_torque_nm = 0.02
pulse_s = 0.02
repetitions_per_direction = 2
quiet_s = 0.25
quiet_timeout_s = 5.0
# 0.01 is below the encoder velocity noise floor at rest (0.025 rev/s measured 2026-10-25)
quiet_velocity_rev_s = 0.03
quiet_span_rev = 0.0005
observe_s = 0.15
response_timeout_s = 0.05
max_velocity_rev_s = 0.8
max_excursion_rev = 0.05

[torque_constant]
# Held-rotor lever/scale fixture (docs/hardware/specs/motor-torque-fixture.md).
# Q-current plateaus are typed interactively; these are the defaults and caps.
sample_rate_hz = 200.0
plateau_s = 3.0
max_plateau_s = 10.0
# Current is ramped linearly from 0 to the target over ramp_s; an instant 6 A step
# compressed the fixture 0.3 mm in 6 ms and tripped the velocity stop (2026-10-25).
ramp_s = 0.25
rest_s = 5.0
baseline_s = 0.25
max_current_a = 8.0
current_overshoot_a = 0.5
max_reported_torque_nm = 0.30
# Session I²t budget: the standard profile is 3 repeats x (0.5² + 1² + 2² + 4² + 6² + 8²) A²
# x 3 s x 2 directions ≈ 2180 A²s. No motor thermistor is fitted; this bounds copper heating.
session_i2t_budget_a2s = 2500.0
max_velocity_rev_s = 0.05
# During the enable transient and the current ramp (first ENABLE_SETTLE_S + ramp_s of a
# plateau) the lever lifted by the ~ -0.3 A enable transient drops back onto the scale at
# 0.05-0.06 rev/s over ~2 mrev (2026-10-26). Only the velocity limit is relaxed in that
# window; the excursion limit applies throughout.
settle_max_velocity_rev_s = 0.15
max_excursion_rev = 0.01
response_timeout_s = 0.05
# --rise-time mode: feedforward torque steps for q-current rise time.
max_rise_torque_nm = 0.05
rise_step_s = 0.5
# Each step is preceded by a pre-hold of rise_prehold_nm (same sign) for rise_prehold_s so
# the controller is already in position mode (10) when the step is applied; a step from the
# stopped state measured the firmware enable sequence (~15 ms, modes 2-3) instead of the
# current loop (2026-10-26, run 174421Z). The pre-hold is small but nonzero so the
# anticogging feedforward (about -0.27 A at the fixture position) does not lift the lever.
rise_prehold_nm = 0.01
rise_prehold_s = 0.25
rise_sample_rate_hz = 400.0
nominal_kt_nm_per_a = 0.025

[coast_down]
# Free coast-downs of the test disc from a speed ladder, plus torque-step spin-ups with
# --accelerate (docs/hardware/specs/coast-down.md). The 24 V bench supply cannot sink
# current, so the motor never brakes: every stop is set_stop() and friction.
sample_rate_hz = 200.0
ladder_rpm = [500.0, 1000.0, 1500.0, 2000.0, 2500.0, 3000.0]
direction = 1
# ~4 A phase; 3000 rpm in about 3 s with the firmware ramp below
spin_up_torque_nm = 0.10
accel_limit_rev_s2 = 20.0
spin_up_timeout_s = 15.0
plateau_s = 3.0
plateau_tolerance_rev_s = 0.5
# below this the coast is over (12 rpm); must stay under the lowest ladder step
coast_stop_rev_s = 0.2
coast_timeout_s = 120.0
# --accelerate: feedforward torque steps from rest, both directions, within the K_t linear range
accel_torques_nm = [0.05, 0.10, 0.15]
accel_target_rev_s = 30.0
accel_timeout_s = 10.0
# host stop thresholds and the firmware-side servo.max_velocity override (Tier B)
max_velocity_rev_s = 55.0
max_torque_nm = 0.20
response_timeout_s = 0.05
# assembly.I_z_kg_m2 of the weighed disc plus screws, copied into run.json
inertia_record = "docs/hardware/measurements/2026-10-28-test-disc.json"
# PNDLM-9 static torque constant for the plateau cross-check
kt_nm_per_a = 0.0244
