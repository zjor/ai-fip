[project]
name = "fip-moteus-host"
version = "0.1.0"
description = "Host-side experiments for the AI-FIP moteus controller"
authors = [{ name = "Sergey Royz", email = "zjor.se@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = ["moteus>=1.1.1,<2"]

[project.scripts]
minute-clock = "moteus_host.clock:main"
bench = "moteus_host.bench.cli:main"

[tool.poetry]
packages = [{ include = "moteus_host" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
